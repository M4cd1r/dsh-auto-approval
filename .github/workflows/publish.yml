name: publish

# Publish dsh-auto-approval to npm via trusted publishing (OIDC) — no long-lived token.
#
# Preconditions (one-time, done locally after the first interactive publish):
#   npm trust github dsh-auto-approval --file publish.yml \
#     --repo Andy8647/dsh-auto-approval --allow-publish
# Requires npm >= 11.15 for the `npm trust` command itself; the publish job only
# needs npm >= 11.5.1 (OIDC support) and Node >= 22.14.
#
# Do NOT add NODE_AUTH_TOKEN / NPM_TOKEN here: an auth token in the environment
# takes precedence over OIDC and would silently fall back to token auth.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # OIDC exchange; the job fails without it

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (OIDC needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test, build
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build

      # npm publish (not pnpm) on purpose: pnpm < 11.1 had OIDC regressions, and
      # npm detects the OIDC environment natively.
      - name: Publish to npm
        run: npm publish --access public
